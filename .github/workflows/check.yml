name: Check the site

# Every PR: build the site and follow it as a person and an AI would (npm run check), then use it in a browser
# (npm run check:pages). deploy.yml runs the first check before it deploys main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          npm ci
          npx @11ty/eleventy
      - name: Links, twins, versions, index, word budgets
        run: npm run check
      - name: The pages in a browser
        # with the runner's own Chrome: Playwright's download doesn't know every runner image
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "browser: $CHROMIUM_PATH"
          CHROMIUM_PATH="$CHROMIUM_PATH" npm run check:pages
