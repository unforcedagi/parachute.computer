name: Check the site

# Every PR: build the site and follow it as a person and an AI would (npm run check). deploy.yml runs the same check
# before it deploys main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          npm ci
          npx @11ty/eleventy
      - name: Links, twins, versions, index
        run: npm run check
